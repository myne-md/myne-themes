# Blank issues stay ENABLED here (unlike the other Myne repos): the website's
# Theme Builder "Share to the gallery" button deep-links to
# issues/new?labels=theme-submission&title=...&body=<theme.json+meta.json>
# (myne-website/src/lib/themeBuilder/shareUrl.mjs). That query-param prefill
# opens a blank prefilled issue; GitHub drops the prefill and redirects to the
# template chooser if blank issues are disabled, so disabling them would
# silently break the builder handoff. The forms below still show in the chooser.
blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability (private)
    url: https://github.com/myne-md/myne/blob/develop/SECURITY.md
    about: Do NOT open a public issue for cryptography, key handling, recovery, sync, or bundle-integrity problems. Email security@myne.md — coordinated disclosure per SECURITY.md.
  - name: Protocol, threat model and specs
    url: https://github.com/myne-md/myne/tree/develop/docs
    about: The v0.1 protocol, threat model, and account-number spec are the source of truth across every client. Read before filing a crypto or on-disk-format issue.
  - name: Questions and general discussion
    url: https://github.com/myne-md/myne/discussions
    about: Not sure it's a bug? Ask here instead of opening an issue.
