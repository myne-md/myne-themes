# Woodpecker CI — myne-themes
# Self-hosted Woodpecker (cicd.myne.md) via Forgejo (git.myne.md) pull-mirror of
# GitHub — the SAME setup as the main repo + companions (not GitHub Actions).
#
# Gate for theme submissions. Automation does the OBJECTIVE checks; a maintainer
# still reviews for deception/taste/quality/licensing before merge (no auto-merge;
# see GOVERNANCE.md). Each step runs in its own container — installed packages do
# NOT inherit between steps.

when:
  - event: [push, pull_request]
    branch: [main]
  - event: manual

steps:
  # ─── Value allowlist + contrast gate — the EXACT client validator ──
  # Builds `theme-validator` from the main `myne` repo and runs its `validate`
  # binary on every theme, so this repo can never host a theme the desktop client
  # would reject (no reimplementation, no drift). The main repo is private, so it
  # is cloned from GitHub with `myne_repo_token` — a read-scoped GitHub fine-
  # grained PAT (myne-md org, Contents+Metadata read-only) provided as an ORG-level
  # Woodpecker secret. Note it authenticates against github.com, NOT the Forgejo
  # mirror the runner itself uses. Only a bare dollar-VAR is referenced, never
  # brace- or paren-substitution syntax — even a literal brace token in a comment
  # makes Woodpecker's env-substitution pass fail config-compile. CAUTION:
  # referencing a secret this repo can't see also errors the WHOLE pipeline at
  # config-compile — keep this name in sync with the org secret.
  validate:
    image: rust:1.96.0-slim
    environment:
      MYNE_REPO_TOKEN:
        from_secret: myne_repo_token
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - git clone --depth 1 "https://x-access-token:$MYNE_REPO_TOKEN@github.com/myne-md/myne.git" _myne
      - cargo build --release -p theme-validator --bin validate --manifest-path _myne/Cargo.toml
      - |
        fail=0
        for f in themes/*/theme.json; do
          [ -e "$f" ] || continue
          if _myne/target/release/validate "$f"; then echo "PASS  $f"; else echo "FAIL  $f"; fail=1; fi
        done
        exit $fail
      # The gate has to be shown REFUSING something, or a binary that silently
      # accepted everything would look identical to a working one. good.json must
      # pass and bad.json (ink ~ paper) must be rejected; either surprise fails.
      - |
        _myne/target/release/validate fixtures/contrast/good.json || { echo "good.json should PASS"; exit 1; }
        if _myne/target/release/validate fixtures/contrast/bad.json; then
          echo "bad.json should have been REFUSED by the contrast gate"; exit 1
        fi
        echo "contrast gate verified: good passes, bad refused"
      # The ornament vocabulary, both directions: a theme using every primitive
      # must validate, and one naming a variant this build does not know must
      # PASS with a warning — a submission may target a newer client, and the
      # older one degrades to plain rather than breaking (myne#394).
      - |
        _myne/target/release/validate fixtures/ornament/all-primitives.json || { echo "all-primitives should PASS"; exit 1; }
        out=$(_myne/target/release/validate fixtures/ornament/unknown-variant.json 2>&1) || { echo "unknown variant should PASS with a warning"; exit 1; }
        case "$out" in *"unrecognized ornament value"*) ;; *) echo "expected a warning, got: $out"; exit 1;; esac
        echo "ornament vocabulary verified: all values accepted, unknown one warns"

  # ─── Metadata lint + unit tests ────────────────────────────────
  # What is left once contrast moved into the Rust validator (myne#394): the
  # meta.json shape/license check, which the client has no opinion about.
  # Zero-dependency (no ajv) — see tools/lint-theme.mjs.
  lint:
    image: node:22-slim
    # `validate` clones the main repo into `_myne/`, and the workspace is shared
    # between steps — so point the renderer's tests at it. Without this they
    # SKIP (loudly, with a reason) rather than fail, because the shared apply
    # helper they exercise ships in that repo; a skipped test that reads as green
    # is the failure class this whole feature has been fighting (myne#394).
    depends_on:
      - validate
    environment:
      MYNE_DIR: _myne
    commands:
      - node --test tools/*.test.mjs
      - node --test tools/build-index.test.mjs
      - |
        fail=0
        for d in themes/*/; do
          [ -e "$d/theme.json" ] || continue
          node tools/lint-theme.mjs "$d" || fail=1
        done
        exit $fail

  # ─── Failure notification (parity with the other repos) ────────
  # Token + group come ONLY from CI secrets; a missing secret makes the step skip
  # silently, and failure:ignore keeps it from ever failing the pipeline.
  notify-failure:
    image: alpine:3.21
    depends_on:
      - name: validate
        optional: true
      - name: lint
        optional: true
    environment:
      PUSHOVER_TOKEN:
        from_secret: pushover_token
      PUSHOVER_GROUP:
        from_secret: pushover_group
    commands:
      - apk add --no-cache curl
      - |
        if [ -z "$PUSHOVER_TOKEN" ]; then echo "pushover secret absent; skipping"; exit 0; fi
        curl -fsS -m 15 \
          --data-urlencode "token=$PUSHOVER_TOKEN" \
          --data-urlencode "user=$PUSHOVER_GROUP" \
          --data-urlencode "title=❌ $CI_REPO_NAME failed · $CI_COMMIT_BRANCH" \
          --data-urlencode "message=$CI_COMMIT_AUTHOR · $CI_COMMIT_MESSAGE" \
          --data-urlencode "url=$CI_PIPELINE_URL" \
          https://api.pushover.net/1/messages.json
    # A PULL-REQUEST failure sends nothing, and `pull_request` was dropped from
    # this list to say so (myne-md/myne#584). `myne-bot` runs a pipeline on every
    # PR and reports on the PR itself, so a push per branch iteration would be
    # noise on top of a signal the author is already reading. A push or a manual
    # run has no such surface. All five repos with a `notify-failure` step now
    # read the same and all five say why; they disagreed three ways before, with
    # no file stating the intent, so the difference read as an oversight in
    # whichever repo you happened to be looking at.
    when:
      - event: [push, manual]
        status: failure
    failure: ignore
