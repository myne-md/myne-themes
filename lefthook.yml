# Lefthook config — myne-themes.
# Install once per clone:  lefthook install
# Skip ad-hoc:             LEFTHOOK=0 git commit ...   (or  git commit --no-verify)

min_version: 2.1.10

commit-msg:
  commands:
    no-ai-coauthor:
      run: |
        # Check only what will reach the commit: cut at the scissors marker and
        # drop git's comment block first.
        if sed -e '/^#.*>8/,$d' "{1}" | git stripspace --strip-comments | grep -qiE 'Co-Authored-By:.*(Claude|Anthropic)|Generated with .*Claude|🤖 Generated'; then
          echo "commit message carries an AI co-author/attribution trailer. Remove it (project policy)."
          exit 1
        fi

pre-push:
  parallel: true
  commands:
    theme-lint:
      glob: "themes/**"
      run: |
        fail=0
        for d in themes/*/; do
          [ -e "$d/theme.json" ] || continue
          node tools/lint-theme.mjs "$d" || fail=1
        done
        exit $fail
